# Authoritative dependency specification. Direct dependencies are pinned exactly here;
# the complete, hash-locked set (including transitive dependencies) is requirements-lock.txt.
# Setup, lock regeneration and verification: README.md "Setup"; rationale: TASKS.md P0.2.

[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "skillgraph"
version = "0.1.0"
description = "Skill Adjacency Graph: evidence-first eligibility and transition-path engine (Skillathon 2026)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
classifiers = ["Private :: Do Not Upload"]
dependencies = [
    "fastapi==0.162.0",
    "uvicorn==0.34.0",
    "pydantic==2.12.5",
    "PyYAML==6.0.3",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "httpx==0.28.1",
]
analysis = [
    "pandas==2.3.1",
]

# The package directory src/skillgraph/ is created in TASKS.md P0.3; the project itself is
# installed (editable, --no-deps) only from that task onwards.
[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
markers = [
    "requires_local_data: needs the restricted local data tree (skipped when absent)",
    "slow: long-running test",
]
